{% extends 'pages/base.html' %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800"><i class="fas fa-chart-pie text-primary me-2"></i> Tableau de Bord (Admin)</h1>
    </div>
    
    <div class="row mt-4">
        <div class="col-xl-4 col-md-6 mb-4">
            <div class="stat-card bg-gradient-blue h-100">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="small text-uppercase fw-bold mb-1 opacity-75">Stagiaires Inscrits</div>
                        <div class="h2 mb-0 fw-bold">{{ nb_etudiants }}</div>
                    </div>
                    <div><i class="fas fa-user-graduate fa-3x opacity-50"></i></div>
                </div>
            </div>
        </div>

        <div class="col-xl-4 col-md-6 mb-4">
            <div class="stat-card bg-gradient-green h-100">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="small text-uppercase fw-bold mb-1 opacity-75">Entreprises</div>
                        <div class="h2 mb-0 fw-bold">{{ nb_entreprises }}</div>
                    </div>
                    <div><i class="fas fa-building fa-3x opacity-50"></i></div>
                </div>
            </div>
        </div>

        <div class="col-xl-4 col-md-6 mb-4">
            <div class="stat-card bg-gradient-purple h-100">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="small text-uppercase fw-bold mb-1 opacity-75">Offres de Stage</div>
                        <div class="h2 mb-0 fw-bold">{{ nb_offres }}</div>
                    </div>
                    <div><i class="fas fa-briefcase fa-3x opacity-50"></i></div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
